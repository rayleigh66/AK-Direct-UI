name: aoking-direct-test

services:
  db-test:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: aoking_direct_test
      POSTGRES_USER: aoking_test
      POSTGRES_PASSWORD: aoking_test_password
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoking_test -d aoking_direct_test"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

volumes:
  postgres_test_data:
