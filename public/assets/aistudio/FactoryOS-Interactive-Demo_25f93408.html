else if(kind==='customer'){let c=state.clients[Number(id)];if(!c)return;title=c.name;sub='客户档案详情';body=`<div class="detail-hero"><h3>${c.name}</h3><p>${c.region}</p></div><div class="detail-grid"><div><small>合作分级</small><b>${c.level}</b></div><div><small>累计订单</small><b>${c.orderCount} 单</b></div><div><small>联系人</small><b>${c.contact}</b></div><div><small>累计合作金额</small><b>${c.amount}</b></div></div><div class="notice gray">${icon('info')} 合同与付款信息应按销售岗位的数据权限单独控制。</div>`;footer=`<button class="btn primary" data-page="quotes">创建报价 ${icon('arrow','sm')}</button>`}

function scan(){const input=$$('#scan-input');let v=input?.value?.trim();if(!v){toast('请扫描或输入纸箱条码');return}if(!/^[A-Za-z0-9][A-Za-z0-9-]{4,39}$/.test(v)){toast('条码格式无效，请使用字母、数字或连字符');return}state.lastScan={code:v};render();$$('#weight-input')?.focus();toast('纸箱条码已识别，请核对重量')}

document.addEventListener('input',e=>{if(e.target.classList.contains('list-search')){let input=e.target, pos=input.selectionStart;state.search=input.value;render();let i=$$('.list-search')[0];if(i){i.focus();i.setSelectionRange(pos,pos)}}if(e.target.id==='command-input')updateSearch()});document.addEventListener('change',e=>{if(e.target.classList.contains('filter-select')){state.filter=e.target.value;render()}if(e.target.id==='material-select'){state.selectedMaterial=Number(e.target.value);render()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeSearch();closeOverlays();$$('#notif-panel').classList.remove('show')}if(e.key==='Enter'&&e.target.id==='scan-input')scan()});
$$('#overlay').addEventListener('click',()=>{closeSearch();closeOverlays()});$$('#global-search-open').addEventListener('click',openSearch);$$('#notifications-open').addEventListener('click',toggleNotification);$$('#mobile-menu').addEventListener('click',()=>{$$('#sidebar').classList.toggle('open');$$('#mobile-backdrop').classList.toggle('open')});$$('#mobile-backdrop').addEventListener('click',()=>{$$('#sidebar').classList.remove('open');$$('#mobile-backdrop').classList.remove('open')});
$$('#header-date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});setNav();render();
</script>
