# Production example only. Do not use until the Owner confirms the domain and
# DNS plan. This file is an override for docker-compose.yml.
services:
  web:
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the production environment}
    volumes:
      - ./deploy/Caddyfile.production.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Caddy redirects every HTTP request to HTTPS, so the base healthcheck
    # (wget http://127.0.0.1/) would follow the redirect to an IP-address
    # certificate and fail. Probe Caddy's local admin endpoint instead.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
